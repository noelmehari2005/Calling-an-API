
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel= "stylesheet" href="style.css">
  <title>Friends Directory</title>

 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="mb-4 text-center">Friends Directory</h1>


    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>Full Name</th>
        </tr>
      </thead>
      <tbody id="friendsTableBody"></tbody>
    </table>

    <div id="friendDetails" class="card mt-4 d-none">
      <div class="card-body">
        <h4 id="detailName"></h4>
        <p><strong>ID:</strong> <span id="detailId"></span></p>
        <p><strong>Phone:</strong> <span id="detailPhone"></span></p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://friends-node-01-47e26a48b0b0.herokuapp.com/friends";
    const tableBody = document.getElementById("friendsTableBody");

    async function loadFriends() {
      try {
        const response = await fetch(API_URL);
        const friends = await response.json();

        friends.forEach(friend => {
          const row = document.createElement("tr");

          const externalLink = `https://api.com/friends/${friend.id}`;

          row.innerHTML = `
            <td>
              <a href="#" onclick="showFriend(${friend.id}); return false;">
                ${friend.firstName} ${friend.lastName}
              </a>
              <br>
              <small>
                <a href="${externalLink}" target="_blank">Open external page</a>
              </small>
            </td>
          `;

          tableBody.appendChild(row);
        });

      } catch (error) {
        console.error("Error loading friends:", error);
      }
    }

    async function showFriend(id) {
      try {
        const response = await fetch(`${API_URL}/${id}`);
        const friend = await response.json();

        document.getElementById("detailName").textContent =
          `${friend.firstName} ${friend.lastName}`;
        document.getElementById("detailId").textContent = friend.id;
        document.getElementById("detailPhone").textContent = friend.phone;

        document.getElementById("friendDetails").classList.remove("d-none");

      } catch (error) {
        console.error("Error loading friend:", error);
      }
    }

    loadFriends();
  </script>

</body>
</html>
